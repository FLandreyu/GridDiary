# =============================================================
# GridDiary 运行配置（放在 exe 同级的 config/ 目录下）
#
# 本文件优先级最高：改完保存，重新双击 GridDiary.exe 即生效。
# 换一台机器演示时，通常只需要改这里的数据库账号密码。
# =============================================================

server:
    port: 8080 # 端口被占用时改成别的，例如 8090

spring:
    datasource:
        # 数据库不存在时会自动创建 grid_diary 库与所有数据表（无需手工执行 schema.sql）
        url: jdbc:mysql://localhost:3306/grid_diary?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        # 优先读环境变量 DB_USERNAME / DB_PASSWORD；下面是兜底默认值。
        # 换一台机器演示时，把这两行改成那台机器的 MySQL 账号密码即可。
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:root}

app:
    # 图片存放目录：${app.home} = exe 所在目录。改成绝对路径（如 D:/GridDiary-upload）也可以
    upload-dir: ${app.home:.}/upload
    open-browser: true # 启动后自动打开浏览器
